<!doctype html>
<html lang="vi" data-release="2026.11.27-p4-test-1">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Thủy sản: Cá tra · Tôm · FinSuccess Research</title>
<!-- 26/11/2026: dashboard Thủy sản tách thành hai dashboard độc lập Ca-tra/ và Tom/. Trang này giữ link cũ:
     ?sub=shrimp / ?section=shrimp → Tom/; ?sub=pang / ?section=pangasius / #mt3 → Ca-tra/; còn lại cho chọn, giữ nguyên ?sub= và #mtN. -->
<script>
(() => {
  const q = new URLSearchParams(location.search), sub = q.get('sub') || '', sec = q.get('section') || '', h = location.hash;
  const go = dir => { const u = new URL('../' + dir + '/', location.href); q.forEach((v, k) => { if (k !== 'v') u.searchParams.set(k, v); }); u.hash = h; location.replace(u.href); };
  if (sub === 'shrimp' || sec === 'shrimp') go('Tom');
  else if (sub === 'pang' || sec === 'pangasius' || h === '#mt3') go('Ca-tra');
  else document.addEventListener('DOMContentLoaded', () => document.querySelectorAll('a[data-keep]').forEach(a => { const u = new URL(a.getAttribute('href'), location.href); q.forEach((v, k) => { if (k !== 'v') u.searchParams.set(k, v); }); u.hash = h; a.href = u.href; }));
})();
</script>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fc;color:#101318;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.box{max-width:640px;margin:24px;padding:28px;background:#fff;border:1px solid #dfe6f7;border-radius:14px;box-shadow:0 10px 28px rgba(17,37,90,.06)}
h1{margin:0 0 6px;font-size:22px;color:#1D2678}p{margin:0 0 18px;color:#4a5168;font-size:14px;line-height:1.55}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick a{display:block;padding:16px;border:1px solid #d6dbe8;border-radius:12px;text-decoration:none;color:inherit}
.pick a:hover,.pick a:focus-visible{border-color:#2938A8;box-shadow:0 0 0 3px rgba(41,56,168,.12)}
.pick b{display:block;font-size:17px;color:#2938A8;margin-bottom:4px}.pick span{font-size:13px;color:#4a5168}
@media (max-width:520px){.pick{grid-template-columns:1fr}}
@media (prefers-color-scheme:dark){body{background:#0f1428;color:#e7eaf5}.box{background:#171d36;border-color:#2b3358}h1{color:#c9d2ff}p,.pick span{color:#b4bbdd}.pick a{border-color:#2b3358}.pick b{color:#AFC0FF}}
</style>
</head>
<body>
<main class="box">
  <h1>Thủy sản đã tách thành hai dashboard</h1>
  <p>Cá tra và tôm là hai chuỗi riêng, nay mỗi ngành có dashboard độc lập.</p>
  <div class="pick">
    <a data-keep href="../Ca-tra/"><b>Cá tra</b><span>VHC · ANV · IDI · ASM</span></a>
    <a data-keep href="../Tom/"><b>Tôm</b><span>FMC · MPC · CMX</span></a>
  </div>
</main>
</body>
</html>
