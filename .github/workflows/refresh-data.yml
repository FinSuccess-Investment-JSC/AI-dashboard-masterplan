name: Refresh dashboard data

"on":
  schedule:
    # 07:30 and 15:30 Asia/Ho_Chi_Minh; GitHub cron uses UTC.
    - cron: '30 0 * * *'
    - cron: '30 8 * * *'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force a release to verify the publication path'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: dashboard-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install parser dependencies
        run: |
          python -m pip install -r scripts/requirements.txt
          if ! command -v tesseract >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y tesseract-ocr
          fi
      - name: Refresh and prepare changed data
        id: refresh
        run: |
          extra=()
          if [ "${{ inputs.force_release }}" = 'true' ]; then extra+=(--force-release); fi
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ] || [ "${{ github.event.schedule }}" = '30 8 * * *' ]; then
            python scripts/refresh_release.py --comparison --prepare-release --notify-file .notify.txt "${extra[@]}"
          else
            python scripts/refresh_release.py --prepare-release --notify-file .notify.txt "${extra[@]}"
          fi
      # Tiers B/C/D (Wi, documents, AI text): queue due items for the 08:00 Claude routine
      # (updates/ROUTINE.md) and check publication pages. Never blocks publishing tier A.
      - name: Queue Wi, document and AI-text updates
        continue-on-error: true
        run: python scripts/update_scheduler.py --run --watch --notify-file .notify.txt
      - name: Validate generated data
        run: |
          python -m unittest discover -s tests
          node tests/data-math.test.cjs
          node tests/financial-comparison.test.cjs
      - name: Publish changed data and schedule state
        env:
          GH_TOKEN: ${{ github.token }}
          DATA_CHANGED: ${{ steps.refresh.outputs.changed }}
        run: |
          git add data/daily-data.js data/update-status.json data/bank-public-data.js data/company-comparison.js data/company-comparison.json data/site-release.json index.html 404.html Bank/index.html Dau-khi/index.html Sugar/index.html duong/index.html updates/state.json updates/last-run.md
          if git diff --cached --quiet; then
            echo 'No observations, source statuses or schedule state changed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$DATA_CHANGED" = 'true' ]; then git commit -m 'Refresh public dashboard observations'; else git commit -m 'Update data schedule state'; fi
          git pull --rebase --autostash origin main  # the Claude routine may have pushed meanwhile
          git push origin HEAD:main
          # GITHUB_TOKEN commits do not trigger the legacy Pages build; schedule-only commits need no build.
          if [ "$DATA_CHANGED" = 'true' ]; then gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"; fi
      # Zalo (or Telegram) alert. Without the secrets the message is only printed to the log.
      - name: Notify changes and source errors
        if: success()
        continue-on-error: true
        env:
          ZALO_OA_TOKEN: ${{ secrets.ZALO_OA_TOKEN }}
          ZALO_USER_ID: ${{ secrets.ZALO_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify.py .notify.txt
      - name: Notify failed run
        if: failure()
        continue-on-error: true
        env:
          ZALO_OA_TOKEN: ${{ secrets.ZALO_OA_TOKEN }}
          ZALO_USER_ID: ${{ secrets.ZALO_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          printf 'Job cập nhật dashboard ngành lỗi, không publish; dữ liệu cũ giữ nguyên.\n%s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > .notify.txt
          python scripts/notify.py .notify.txt
