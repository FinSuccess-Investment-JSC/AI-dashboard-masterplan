<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FinSuccess Industry Dashboard Database</title>
<link rel="stylesheet" href="assets/site-navigation.css?v=54a3825f55f4">
<script src="assets/site-navigation.js?v=0c9b4dc10f61" data-release="20261010T144225Z"></script>
<style>
:root{--navy:#11255a;--navy2:#1d3678;--accent:#27af95;--accent2:#2fd0b2;--page:#f5f7fc;--card:#fff;--ink:#101318;--ink2:#3d4653;--muted:#6b7686;--line:#dfe6f7;--hair:#eaf0fb;--soft:#eef5f8;--red:#b8443a;--shadow:0 1px 2px rgba(17,37,90,.04),0 10px 28px rgba(17,37,90,.06)}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:inherit}
.topbar{background:linear-gradient(103deg,var(--navy),#223b7a);color:#fff}
.topbar-inner{max-width:1380px;margin:auto;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{font-weight:900;letter-spacing:.2px}.brand small{display:block;color:#c9d6f0;font-size:11px;font-weight:650;margin-top:2px}
.topnav{display:flex;gap:14px;flex-wrap:wrap}.topnav a{font-size:12px;font-weight:800;color:#dbe6f7;text-decoration:none}.topnav a:hover{color:var(--accent2)}
.wrap{max-width:1380px;margin:auto;padding:22px}
.hero{border-radius:10px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);padding:22px}
.hero h1{font-family:"Newsreader",Georgia,serif;font-size:34px;line-height:1.05;margin:0 0 9px;color:var(--navy);font-weight:600}.hero h1 em{color:var(--accent);font-style:italic}
.hero p{margin:0;color:var(--ink2);font-size:13.5px;line-height:1.6;max-width:980px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.pill{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:6px 10px;font-size:11px;font-weight:800;color:var(--navy)}
.layout{display:grid;grid-template-columns:300px 1fr;gap:14px;margin-top:16px;align-items:start}
.side{position:sticky;top:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:10px}
.tab{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;border:0;border-bottom:1px solid var(--hair);background:transparent;color:var(--ink2);padding:11px 9px;text-align:left;cursor:pointer;font:inherit}
.tab:last-child{border-bottom:0}.tab strong{font-size:13px;color:var(--ink)}.tab span{font-size:10.5px;font-weight:850;border-radius:999px;padding:3px 7px;background:var(--soft);color:var(--muted);white-space:nowrap}
.tab.ready span{background:#e7f5f1;color:var(--accent)}.tab.active{background:#edf5fb;border-radius:8px;border-bottom-color:transparent}.tab.active strong{color:var(--navy)}
.pane{display:none}.pane.active{display:block}.grid{display:grid;gap:14px}.two{grid-template-columns:1fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:15px}
.card h2,.card h3{margin:0;color:var(--navy)}.card h2{font-size:20px}.card h3{font-size:14px}.sub{margin:5px 0 0;color:var(--muted);font-size:12.5px;line-height:1.5}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:34px;border-radius:8px;padding:8px 12px;text-decoration:none;font-size:12px;font-weight:850;border:1px solid var(--line);background:var(--card);color:var(--navy)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}.btn.primary:hover{background:var(--accent);border-color:var(--accent)}.btn.disabled{pointer-events:none;color:var(--muted);background:#f2f4f8}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:13px}.fact{border:1px solid var(--hair);border-radius:8px;background:#fbfcfe;padding:10px}.fact b{display:block;font-size:17px;color:var(--ink)}.fact span{display:block;margin-top:3px;font-size:10.5px;color:var(--muted);line-height:1.35}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}th,td{padding:9px 7px;border-bottom:1px solid var(--hair);text-align:left;vertical-align:top}th{font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted)}td b{color:var(--ink)}
.status{display:inline-flex;border-radius:999px;padding:3px 8px;font-size:10.5px;font-weight:850}.s-ready{background:#e7f5f1;color:var(--accent)}.s-empty{background:#eef1f5;color:var(--muted)}
.note{border-left:4px solid var(--accent);background:#eef8f5;border-radius:8px;padding:12px 13px;color:var(--ink2);font-size:12.5px;line-height:1.55}.warn{border-left-color:var(--red);background:#fbecea}
.ready-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:20px 0}.industry-card{display:flex;flex-direction:column;gap:12px;min-width:0}.industry-card .actions{margin-top:auto}.industry-card h2{font-size:23px}.industry-card .facts{grid-template-columns:1fr 1fr}.industry-card ul{margin:0;padding-left:18px;color:var(--ink2);font-size:12px;line-height:1.8}.industry-card .btn{width:100%;min-height:42px}.planned-industries{margin-top:24px}.planned-industries>summary{cursor:pointer;font-size:14px;font-weight:700;color:var(--navy)}.tab{text-decoration:none}.ready-grid+.site-release-inline{margin-top:0}
@media(max-width:1280px){.ready-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:900px){.ready-grid{grid-template-columns:1fr}}
@media(max-width:900px){.layout{grid-template-columns:1fr}.side{position:static}.two,.facts{grid-template-columns:1fr}.wrap{padding:14px}.hero h1{font-size:27px}}
</style>
<link rel="stylesheet" href="assets/fin-success-theme.css?v=ae5d52d8722e">
</head>
<body class="fs-home">
<nav data-site-navigation="home" aria-label="Điều hướng dashboard ngành"></nav>
<main class="fs-home-main"></main>
</body>
</html>
